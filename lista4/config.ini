# Sciezka do folderu z plikami testowymi (musi konczyc sie slashem!)
data_folder=./data_generated/
output_file=results-gen.csv
show_progress=1

# Liczba powtorzen dla dokladniejszego sredniego czasu
repeats=10

# Znaczenie sladu feromonowego (alpha)
alpha=1.0

# Znaczenie heurystyki (beta)
beta=2.0,3.0

# Wspolczynnik parowania feromonu (rho)
evaporation_rate=0.1,0.5

# Liczba mrowek (-1 oznacza liczbe rowna liczbie miast)
ants_count=-1,10,20

# Liczba iteracji
iterations=1000

# Metoda inicjalizacji feromonu: 0=RANDOM, 1=NN, 2=RNN
init_method=1

# Limit czasu podany w minutach dla danej instancji
time_limit_min=15